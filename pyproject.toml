[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payments-data-platform"
version = "0.1.0"
description = "Streaming CDC lakehouse and batch FX warehouse for payments data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pyspark==3.5.1",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "duckdb>=1.0",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "httpx>=0.27",
    "pytest>=7.4",
    "setuptools<81; python_version >= '3.12'",
]
serve = ["uvicorn[standard]>=0.30", "trino>=0.329"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
