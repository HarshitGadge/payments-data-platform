# Local stack: Postgres -> Debezium/Kafka -> Spark -> Iceberg/MinIO -> Trino -> API.
#
#   docker compose up -d
#   docker compose exec kafka-connect \
#     curl -s -XPOST -H 'Content-Type: application/json' \
#     --data @/etc/connect/payments-connector.json http://localhost:8083/connectors
#
# Credentials are read from the environment (see .env.example); no secret has a
# working default, so a misconfigured stack fails to start rather than coming up
# with a well-known password.

name: payments-platform

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    # Logical replication is what Debezium reads; the default wal_level=replica
    # does not emit row images.
    command: >
      postgres -c wal_level=logical
               -c max_replication_slots=4
               -c max_wal_senders=4
    volumes:
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d payments"]
      interval: 5s
      retries: 12

  kafka:
    # apache/kafka is the ASF's own image. bitnami/kafka was used here until
    # Bitnami withdrew its public tags; pinning a withdrawn tag makes the stack
    # unstartable, so this is pinned to a digest-backed release that exists.
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single broker: the defaults of 3 would leave internal topics unwritable.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      retries: 18

  kafka-connect:
    image: debezium/connect:2.7.3.Final
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: payments-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      # Registers the ${env:...} indirection the connector config relies on.
      # Without these two the worker treats "${env:POSTGRES_USER}" as a literal
      # username and the connector fails validation with an auth error.
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
    volumes:
      - ./config/connect:/etc/connect:ro
    ports: ["8083:8083"]

  # S3 for the Iceberg warehouse. LocalStack stands in for S3 locally; the
  # minio/minio image this previously used no longer exists on Docker Hub.
  # Production points the same settings at real S3.
  objectstore:
    image: localstack/localstack:3.8
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./config/localstack:/etc/localstack/init/ready.d:ro
      - objectstore_data:/var/lib/localstack
    ports: ["4566:4566"]
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3 ls s3://lakehouse >/dev/null 2>&1 || exit 1"]
      interval: 10s
      retries: 18

  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    depends_on:
      objectstore: {condition: service_healthy}
    environment:
      CATALOG_WAREHOUSE: s3://lakehouse/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://objectstore:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_REGION: us-east-1
    ports: ["8181:8181"]

  trino:
    image: trinodb/trino:455
    depends_on: [iceberg-rest]
    volumes:
      - ./config/trino:/etc/trino/catalog:ro
    ports: ["8080:8080"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on: [trino]
    environment:
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      TRINO_CATALOG: lakehouse
      TRINO_SCHEMA: gold
    ports: ["8000:8000"]

volumes:
  postgres_data:
  objectstore_data:
