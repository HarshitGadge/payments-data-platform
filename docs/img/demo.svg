<svg xmlns="http://www.w3.org/2000/svg" width="589" height="1150" viewBox="0 0 589 1150" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12"><rect width="589" height="1150" rx="8" fill="#0d1117" stroke="#30363d"/><path d="M0 8a8 8 0 0 1 8-8h573a8 8 0 0 1 8 8v26H0z" fill="#161b22"/><circle cx="20" cy="17" r="5" fill="#ff5f56"/><circle cx="36" cy="17" r="5" fill="#ffbd2e"/><circle cx="52" cy="17" r="5" fill="#27c93f"/><text x="295" y="21" fill="#6e7681" text-anchor="middle">python demo.py</text><text x="20.0" y="59" xml:space="preserve"><tspan fill="#6e7681">==========================================================================</tspan></text><text x="20.0" y="76" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#d29922">REAL CAPTURE</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#79c0ff">a message from an actual Debezium connector</tspan></text><text x="20.0" y="93" xml:space="preserve"><tspan fill="#6e7681">==========================================================================</tspan></text><text x="20.0" y="110" xml:space="preserve"><tspan fill="#c9d1d9">  Captured by running this repo&#x27;s docker-compose stack:</tspan></text><text x="20.0" y="127" xml:space="preserve"><tspan fill="#c9d1d9">  Postgres 16 (wal_level=logical) </tspan><tspan fill="#6e7681">-&gt;</tspan><tspan fill="#a5d6ff"> Debezium 2.7 -&gt; Kafka.</tspan></text><text x="20.0" y="144" xml:space="preserve"><tspan fill="#c9d1d9"> </tspan></text><text x="20.0" y="161" xml:space="preserve"><tspan fill="#c9d1d9">  source row, straight from Postgres:</tspan></text><text x="20.0" y="178" xml:space="preserve"><tspan fill="#c9d1d9">    1001 | 42.13 | EUR | 2026-09-26 04:03:07.456703</tspan></text><text x="20.0" y="195" xml:space="preserve"><tspan fill="#c9d1d9"> </tspan></text><text x="20.0" y="212" xml:space="preserve"><tspan fill="#c9d1d9">  the same row as it arrived on the topic:</tspan></text><text x="20.0" y="229" xml:space="preserve"><tspan fill="#c9d1d9">    </tspan><tspan fill="#c9d1d9">amount</tspan><tspan fill="#c9d1d9">         </tspan><tspan fill="#a5d6ff">&#x27;EHU=&#x27;</tspan></text><text x="20.0" y="246" xml:space="preserve"><tspan fill="#c9d1d9">    </tspan><tspan fill="#c9d1d9">created_at</tspan><tspan fill="#c9d1d9">     </tspan><tspan fill="#a5d6ff">1790395387456703</tspan></text><text x="20.0" y="263" xml:space="preserve"><tspan fill="#c9d1d9"> </tspan></text><text x="20.0" y="280" xml:space="preserve"><tspan fill="#c9d1d9">  after decoding:</tspan></text><text x="20.0" y="297" xml:space="preserve"><tspan fill="#c9d1d9">    </tspan><tspan fill="#c9d1d9">amount</tspan><tspan fill="#c9d1d9">         </tspan><tspan fill="#a5d6ff">42.13</tspan></text><text x="20.0" y="314" xml:space="preserve"><tspan fill="#c9d1d9">    </tspan><tspan fill="#c9d1d9">created_at</tspan><tspan fill="#c9d1d9">     </tspan><tspan fill="#a5d6ff">2026-09-26 04:03:07.456703+00:00</tspan></text><text x="20.0" y="331" xml:space="preserve"><tspan fill="#c9d1d9">    </tspan><tspan fill="#c9d1d9">op</tspan><tspan fill="#c9d1d9">             </tspan><tspan fill="#a5d6ff">&#x27;r&#x27; (snapshot read)</tspan></text><text x="20.0" y="348" xml:space="preserve"><tspan fill="#c9d1d9"> </tspan></text><text x="20.0" y="365" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#3fb950">[ok]</tspan><tspan fill="#c9d1d9"> matches the source row exactly, to the microsecond</tspan></text><text x="20.0" y="399" xml:space="preserve"><tspan fill="#6e7681">==========================================================================</tspan></text><text x="20.0" y="416" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#d29922">FX</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#79c0ff">converting at the rate effective on the payment date</tspan></text><text x="20.0" y="433" xml:space="preserve"><tspan fill="#6e7681">==========================================================================</tspan></text><text x="20.0" y="450" xml:space="preserve"><tspan fill="#c9d1d9">  published: Fri 2026-01-02 EUR 0.92    Mon 2026-01-05 EUR 0.95</tspan></text><text x="20.0" y="467" xml:space="preserve"><tspan fill="#c9d1d9">             (nothing for Sat/Sun -- the FX market is closed)</tspan></text><text x="20.0" y="484" xml:space="preserve"><tspan fill="#c9d1d9"> </tspan></text><text x="20.0" y="501" xml:space="preserve"><tspan fill="#c9d1d9">    EUR 100.00 on Friday    </tspan><tspan fill="#6e7681">-&gt;</tspan><tspan fill="#a5d6ff"> USD 108.70</tspan></text><text x="20.0" y="518" xml:space="preserve"><tspan fill="#c9d1d9">    EUR 100.00 on Saturday  </tspan><tspan fill="#6e7681">-&gt;</tspan><tspan fill="#a5d6ff"> USD 108.70</tspan><tspan fill="#8b949e">   &lt;-</tspan><tspan fill="#8b949e"> carried forward from Friday</tspan></text><text x="20.0" y="535" xml:space="preserve"><tspan fill="#c9d1d9">    EUR 100.00 on Monday    </tspan><tspan fill="#6e7681">-&gt;</tspan><tspan fill="#a5d6ff"> USD 105.26</tspan></text><text x="20.0" y="552" xml:space="preserve"><tspan fill="#c9d1d9"> </tspan></text><text x="20.0" y="569" xml:space="preserve"><tspan fill="#c9d1d9">    GBP 100.00 with no rate  </tspan><tspan fill="#6e7681">-&gt;</tspan><tspan fill="#a5d6ff"> None</tspan></text><text x="20.0" y="586" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#3fb950">[ok]</tspan><tspan fill="#c9d1d9"> not defaulted to 1.0, which would report GBP as USD</tspan></text><text x="20.0" y="620" xml:space="preserve"><tspan fill="#6e7681">==========================================================================</tspan></text><text x="20.0" y="637" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#d29922">LAKEHOUSE</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#79c0ff">CDC merge into a real Iceberg table</tspan></text><text x="20.0" y="654" xml:space="preserve"><tspan fill="#6e7681">==========================================================================</tspan></text><text x="20.0" y="671" xml:space="preserve"><tspan fill="#c9d1d9">    insert 1001, 1002                                rows=2</tspan></text><text x="20.0" y="688" xml:space="preserve"><tspan fill="#c9d1d9">    update 1001 </tspan><tspan fill="#6e7681">-&gt;</tspan><tspan fill="#a5d6ff"> refunded                          rows=2</tspan></text><text x="20.0" y="705" xml:space="preserve"><tspan fill="#c9d1d9">    REPLAY stale lsn=100 (must be ignored)           rows=2</tspan></text><text x="20.0" y="722" xml:space="preserve"><tspan fill="#c9d1d9">    1001 status after stale replay                   &#x27;refunded&#x27;</tspan></text><text x="20.0" y="739" xml:space="preserve"><tspan fill="#c9d1d9">    delete 1002                                      rows=1</tspan></text><text x="20.0" y="756" xml:space="preserve"><tspan fill="#c9d1d9"> </tspan></text><text x="20.0" y="773" xml:space="preserve"><tspan fill="#c9d1d9">  final table:</tspan></text><text x="20.0" y="790" xml:space="preserve"><tspan fill="#484f58">+</tspan><tspan fill="#484f58">----------</tspan><tspan fill="#484f58">+</tspan><tspan fill="#484f58">------</tspan><tspan fill="#484f58">+</tspan><tspan fill="#484f58">--------</tspan><tspan fill="#484f58">+</tspan><tspan fill="#484f58">--------------</tspan><tspan fill="#484f58">+</tspan></text><text x="20.0" y="807" xml:space="preserve"><tspan fill="#484f58">|</tspan><tspan fill="#c9d1d9">payment_id</tspan><tspan fill="#484f58">|</tspan><tspan fill="#c9d1d9">amount</tspan><tspan fill="#484f58">|</tspan><tspan fill="#c9d1d9">currency</tspan><tspan fill="#484f58">|</tspan><tspan fill="#c9d1d9">payment_status</tspan><tspan fill="#484f58">|</tspan></text><text x="20.0" y="824" xml:space="preserve"><tspan fill="#484f58">+</tspan><tspan fill="#484f58">----------</tspan><tspan fill="#484f58">+</tspan><tspan fill="#484f58">------</tspan><tspan fill="#484f58">+</tspan><tspan fill="#484f58">--------</tspan><tspan fill="#484f58">+</tspan><tspan fill="#484f58">--------------</tspan><tspan fill="#484f58">+</tspan></text><text x="20.0" y="841" xml:space="preserve"><tspan fill="#484f58">|</tspan><tspan fill="#c9d1d9">1001      </tspan><tspan fill="#484f58">|</tspan><tspan fill="#c9d1d9">149.99</tspan><tspan fill="#484f58">|</tspan><tspan fill="#c9d1d9">EUR     </tspan><tspan fill="#484f58">|</tspan><tspan fill="#c9d1d9">refunded      </tspan><tspan fill="#484f58">|</tspan></text><text x="20.0" y="858" xml:space="preserve"><tspan fill="#484f58">+</tspan><tspan fill="#484f58">----------</tspan><tspan fill="#484f58">+</tspan><tspan fill="#484f58">------</tspan><tspan fill="#484f58">+</tspan><tspan fill="#484f58">--------</tspan><tspan fill="#484f58">+</tspan><tspan fill="#484f58">--------------</tspan><tspan fill="#484f58">+</tspan></text><text x="20.0" y="892" xml:space="preserve"><tspan fill="#6e7681">==========================================================================</tspan></text><text x="20.0" y="909" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#d29922">API</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#79c0ff">serving tier over gold</tspan></text><text x="20.0" y="926" xml:space="preserve"><tspan fill="#6e7681">==========================================================================</tspan></text><text x="20.0" y="943" xml:space="preserve"><tspan fill="#c9d1d9">  GET /v1/merchants/1/revenue?start_date=2026-01-01&amp;end_date=2026-01-01</tspan></text><text x="20.0" y="977" xml:space="preserve"><tspan fill="#c9d1d9">    </tspan><tspan fill="#d2a8ff">&quot;total_by_currency&quot;</tspan><tspan fill="#6e7681">: </tspan><tspan fill="#a5d6ff">[</tspan></text><text x="20.0" y="994" xml:space="preserve"><tspan fill="#6e7681">        {</tspan></text><text x="20.0" y="1011" xml:space="preserve"><tspan fill="#c9d1d9">            </tspan><tspan fill="#d2a8ff">&quot;amount&quot;</tspan><tspan fill="#6e7681">: </tspan><tspan fill="#a5d6ff">&quot;1234567.89&quot;,</tspan></text><text x="20.0" y="1028" xml:space="preserve"><tspan fill="#c9d1d9">            </tspan><tspan fill="#d2a8ff">&quot;currency&quot;</tspan><tspan fill="#6e7681">: </tspan><tspan fill="#a5d6ff">&quot;EUR&quot;</tspan></text><text x="20.0" y="1045" xml:space="preserve"><tspan fill="#6e7681">        },</tspan></text><text x="20.0" y="1079" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#3fb950">[ok]</tspan><tspan fill="#c9d1d9"> amounts are JSON strings: 1234567.89 sent as a JSON number</tspan></text><text x="20.0" y="1096" xml:space="preserve"><tspan fill="#c9d1d9">       comes back as 1234567.8899999999 in most clients</tspan></text><text x="20.0" y="1113" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#3fb950">[ok]</tspan><tspan fill="#c9d1d9"> unknown merchant     </tspan><tspan fill="#6e7681">-&gt;</tspan><tspan fill="#a5d6ff"> 404</tspan></text><text x="20.0" y="1130" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#3fb950">[ok]</tspan><tspan fill="#c9d1d9"> reversed date range  </tspan><tspan fill="#6e7681">-&gt;</tspan><tspan fill="#a5d6ff"> 422</tspan></text></svg>